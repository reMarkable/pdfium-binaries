name: Build all

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.branch }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: PDFium branch
        required: false
        default: main
      version:
        description: PDFium version
        required: false
        default: ""
      is_debug:
        description: Is debug
        type: boolean
        required: false
        default: false
      release:
        description: Publish GitHub release
        type: boolean
        required: false
        default: false

jobs:
  android_arm:
    name: Android ARM
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: android
      target_cpu: arm

  android_arm64:
    name: Android ARM64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: android
      target_cpu: arm64

  android_x64:
    name: Android x64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: android
      target_cpu: x64

  android_x86:
    name: Android x86
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: android
      target_cpu: x86

  ios_device_arm64:
    name: iOS device ARM64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: ios
      target_cpu: arm64
      target_environment: device

  ios_simulator_arm64:
    name: iOS simulator ARM64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: ios
      target_cpu: arm64
      target_environment: simulator

  ios_simulator_x64:
    name: iOS simulator x64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: ios
      target_cpu: x64
      target_environment: simulator

  linux_arm:
    name: Linux ARM
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: linux
      target_cpu: arm

  linux_arm64:
    name: Linux ARM64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: linux
      target_cpu: arm64

  linux_x64:
    name: Linux x64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: linux
      target_cpu: x64

  linux_x86:
    name: Linux x86
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: linux
      target_cpu: x86

  mac_arm64:
    name: macOS ARM64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: mac
      target_cpu: arm64

  mac_x64:
    name: macOS x64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: mac
      target_cpu: x64

  win_x64:
    name: Windows x64
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: win
      target_cpu: x64

  win_x86:
    name: Windows x86
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: win
      target_cpu: x86

  mac_univ:
    name: macOS univ
    needs:
      - mac_arm64
      - mac_x64
    permissions:
      contents: read
      actions: write # Download/upload workflow artifacts
    uses: ./.github/workflows/mac-univ.yml
    with:
      artifact_x64: ${{ needs.mac_x64.outputs.artifact }}
      artifact_arm64: ${{ needs.mac_arm64.outputs.artifact }}

  publish:
    name: Publish Release
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tagname: ${{ github.event.inputs.branch }}
    if: startsWith(github.event.inputs.branch, 'chromium/') && github.event.inputs.version && github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    needs:
      - android_arm
      - android_arm64
      - android_x64
      - android_x86
      - ios_device_arm64
      - ios_simulator_arm64
      - ios_simulator_x64
      - linux_arm
      - linux_arm64
      - linux_x64
      - linux_x86
      - mac_arm64
      - mac_univ
      - mac_x64
      - win_x64
      - win_x86
    permissions:
      contents: write # to create releases
      id-token: write # to attest build provenance
      attestations: write # to attest build provenance
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
      - name: Create tarballs
        run: |
          for DIR in pdfium-*; do
            echo "::group::$DIR"
            (cd $DIR; tar czf ../$DIR.tgz *)
            echo "::endgroup::"
          done
      - name: Write release body
        run: echo "This version was built with branch \`$BRANCH\` of PDFium" > RELEASE.md
        env:
          BRANCH: ${{ github.event.inputs.branch }}
      - name: Get changes
        continue-on-error: true
        run: |
          CURRENT_REV=$BRANCH
          PREVIOUS_REV=$(curl --silent "$LATEST_RELEASE_URL" | jq -r ".tag_name")
          git clone -b "$BRANCH" https://pdfium.googlesource.com/pdfium.git
          cat <<END >> RELEASE.md
          ### Changes
          Commits between \`$PREVIOUS_REV\` and \`$CURRENT_REV\`:
          END
          git -C "pdfium" log origin/${PREVIOUS_REV}.. --pretty=format:'* [%s](https://pdfium.googlesource.com/pdfium/+/%H)' >> RELEASE.md
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          LATEST_RELEASE_URL: ${{ format('{0}/repos/{1}/releases/latest', github.api_url, github.repository) }}
      - name: Generate artifacts checksums
        id: hash
        run: echo "hashes=$(sha256sum pdfium-*.tgz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: pdfium-*.tgz
      - name: Rename provenance file
        run: mv "$BUNDLE_PATH" pdfium-attestation.json
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
      - name: Publish Release
        run: |
          gh release create "$BRANCH" \
            pdfium-*.tgz \
            pdfium-attestation.json \
            --target "$GITHUB_SHA" \
            --title "PDFium $VERSION" \
            --notes-file RELEASE.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.inputs.branch }}
          VERSION: ${{ github.event.inputs.version }}
